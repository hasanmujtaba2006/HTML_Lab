<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Navigation</title>
    <style>
        nav {
            display: flex;
            background-color: #1d3557;
            gap: 20px;
            padding: 16px;
        }

        nav a {
            color: white;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>
    </nav>
</body>
</html>
