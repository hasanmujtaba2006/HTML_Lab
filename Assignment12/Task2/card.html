<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        .card {
            background-color: #f1faee;
            border: 2px solid #1d3557;
            border-radius: 12px;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Welcome</h3>
        <p>This is a simple card with a rounded border and padding.</p>
    </div>
</body>
</html>
