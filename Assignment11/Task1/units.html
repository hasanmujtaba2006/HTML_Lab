<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>
    <style>
        .pixel-box {
            width: 200px;
            height: 40px;
            background-color: lightblue;
        }

        .percentage-box {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="pixel-box"></div>
    <div class="percentage-box"></div>
    <p>This paragraph demonstrates a rem-based font size.</p>
</body>
</html>
