<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Areas</title>
    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 12px;
        }

        header {
            grid-area: header;
            background-color: #1d3557;
            color: white;
            padding: 20px;
        }

        aside {
            grid-area: sidebar;
            background-color: #a8dadc;
            padding: 20px;
        }

        main {
            grid-area: main;
            background-color: #f1faee;
            padding: 20px;
        }

        footer {
            grid-area: footer;
            background-color: #457b9d;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>Dashboard Header</header>
        <aside>Sidebar</aside>
        <main>Main Area</main>
        <footer>Dashboard Footer</footer>
    </div>
</body>
</html>
